[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sp500_momentum"
version = "0.0.1"
description = "Monthly-winner momentum strategy on point-in-time S\u0026P 500 members, with an ML ranking model, survivorship-bias-aware data and an exact backtest against SPY."
authors = [
  { name = "Siddharth" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "lxml>=6.1.3",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pillow>=13",
    "pip",
    "pyarrow>=26.0.0",
    "python-dateutil>=4.0.0",
    "python-dotenv",
    "requests>=2.34.2",
    "scikit-learn",
    "ta-lib>=0.6",
    "tqdm",
    "typer",
    "xgboost-cpu>=3.4.1",
    "yfinance>=1.7.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["sp500_momentum"]
# tests/ was missing from the template's list, so `ruff check` silently skipped it (found 3 Nov 2026);
# dashboard/ likewise when it was added (5 Nov). Every new top-level code folder goes here.
include = [
    "pyproject.toml",
    "sp500_momentum/**/*.py",
    "tests/**/*.py",
    "notebooks/**/*.ipynb",
    "dashboard/**/*.py",
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["sp500_momentum"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "kaleido>=1.5.0",
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "streamlit>=1.66.1",
]
