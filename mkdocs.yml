# The project book as a website, published on GitHub Pages by .github/workflows/pages.yml on every
# merge to main. GitHub also shows the Markdown files as they are. Locally:
#   uv run mkdocs serve            # preview at http://127.0.0.1:8000
#   uv run mkdocs build --strict   # what CI runs: any broken chart or link fails
site_name: S&P 500 momentum winners
site_url: https://siddharthps.github.io/sp500-momentum-winners/
repo_url: https://github.com/siddharthps/sp500-momentum-winners
docs_dir: docs
# Charts live in reports/figures/ and a few links point outside docs/: the hooks adapt them at
# build time, so the chapters keep the paths that work on GitHub (#26).
hooks:
  - scripts/mkdocs_hooks.py
theme:
  name: material
nav:
  - Contents: index.md
  - 1. The problem and the idea: 01_problem.md
  - 2. Data collection: 02_data_collection.md
  - 3. Building the monthly table: 03_monthly_table.md
  - 4. Features: 04_features.md
  - 5. Exploratory analysis: 05_eda.md
  - 6. Modelling: 06_modelling.md
  - 7. Trading simulation and results: 07_simulation.md
  - 8. Automation: 08_automation.md
  - 9. Limitations, lessons and next steps: 09_lessons.md
  - Appendix A. Data dictionary: appendix_a_data_dictionary.md
  - Appendix B. The full working record: appendix_b_working_record.md
