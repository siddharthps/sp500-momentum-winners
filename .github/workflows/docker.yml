# The Docker image (#48). On pull requests: build the test image and run the tests inside it.
# On merges to main: also publish the runtime image to GitHub Container Registry:
#   docker pull ghcr.io/siddharthps/sp500-momentum-winners:latest
# No secrets are used at build time; the image holds no data or secrets (see .dockerignore).
name: Docker

# Runs only when something that changes what the image does changes: the build, the environment,
# the code and tests, the notebooks, and the files the pipeline reads (reports/*.csv holds the tuned
# settings; references/*.csv the removed members' sectors). Docs-only changes skip it. That's safe
# because only the CI workflow's `checks` job is required by main's protection rule.
on:
  pull_request:
    paths: # keep the two lists identical
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "sp500_momentum/**"
      - "scripts/**"
      - "dashboard/**"
      - "tests/**"
      - "notebooks/**"
      - "reports/**"
      - "references/*.csv"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "sp500_momentum/**"
      - "scripts/**"
      - "dashboard/**"
      - "tests/**"
      - "notebooks/**"
      - "reports/**"
      - "references/*.csv"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the test image (the runtime image plus the dev tools)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: test
          load: true
          tags: sp500-momentum:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the tests inside the container
        run: docker run --rm sp500-momentum:test

      - name: The runtime image starts (dry run of the rebuild)
        run: |
          docker build --target base -t sp500-momentum:runtime .
          docker run --rm sp500-momentum:runtime

      - name: Vulnerability scan of the runtime image (report only)
        # pinned to a commit, not a tag: this action's tags were re-created in March 2026, and a
        # tag can be moved while a commit can't
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sp500-momentum:runtime
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0" # report, don't fail: most findings have no fix yet (see the README)

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the runtime image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: base
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=S&P 500 momentum winners: the pipeline, from uv's lock file
            org.opencontainers.image.licenses=MIT
